<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>._.</title>

<style>
/* 전체 배경 */
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffe4ec, #e0f7ff);
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* 가운데 UI */
    .card {
        background: rgba(255, 255, 255, 0.92);
        padding: 35px;
        border-radius: 25px;
        box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        text-align: center;
        width: 320px;
        backdrop-filter: blur(10px);
        position: relative;
        z-index: 2;
    }

    /* 입력창 */
    input {
        width: 90%;
        padding: 12px;
        border: 2px solid #ffd1dc;
        border-radius: 12px;
        outline: none;
    }

    /* 버튼 */
    button {
        margin-top: 10px;
        padding: 12px 18px;
        border: none;
        border-radius: 14px;
        background: #ff7aa2;
        color: white;
        cursor: pointer;
        font-weight: bold;
    }

    /* 결과 텍스트 */
    #result {
        margin-top: 18px;
        font-size: 16px;
        color: #444;
    }

    /* =======================
       고양이 캐릭터 스타일
    ======================= */
    .cat {
        position: fixed;
        width: 110px;
        height: 110px;
        pointer-events: none; /* 클릭 안되게 */
        z-index: 999;
        filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
    }

    /* =======================
       발자국 스타일
    ======================= */
    .paw {
        position: fixed;
        font-size: 18px;
        opacity: 0.85;
        pointer-events: none;
        z-index: 998;
        animation: fadeOut 1.3s forwards;
    }

    /* 발자국 사라지는 애니메이션 */
    @keyframes fadeOut {
        0% { opacity: 0.85; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.6); }
    }
</style>
</head>

<body>

<!--  거멍이님 만들기 -->
<div class="cat" id="cat">
<svg width="110" height="110" viewBox="0 0 64 64">

    <!-- 귀 -->
    <path d="M18 26 Q20 10 30 22 Z" fill="#000"/>
    <path d="M46 26 Q44 10 34 22 Z" fill="#000"/>

    <!-- 얼굴 -->
    <ellipse cx="32" cy="36" rx="20" ry="18" fill="#000"/>

    <!-- 볼 -->
    <circle cx="22" cy="44" r="6" fill="#000"/>
    <circle cx="42" cy="44" r="6" fill="#000"/>

    <!-- 눈 -->
    <ellipse cx="25" cy="33" rx="5" ry="6.5" fill="#ffd84d"/>
    <ellipse cx="39" cy="33" rx="5" ry="6.5" fill="#ffd84d"/>

    <!-- 눈동자 -->
    <circle cx="25" cy="34" r="1.8" fill="#000"/>
    <circle cx="39" cy="34" r="1.8" fill="#000"/>

    <!-- 코 -->
    <circle cx="32" cy="38" r="1.4" fill="#ff9dbb"/>

    <!-- 입 -->
    <path d="M28 40 Q32 44 36 40" stroke="#fff" stroke-width="1.2" fill="none"/>

    <!-- 수염 -->
    <path d="M18 36 L8 34" stroke="#fff" stroke-width="1"/>
    <path d="M18 39 L8 40" stroke="#fff" stroke-width="1"/>
    <path d="M46 36 L56 34" stroke="#fff" stroke-width="1"/>
    <path d="M46 39 L56 40" stroke="#fff" stroke-width="1"/>

</svg>
</div>

<!-- =======================
    메인 ui
======================= -->
<div class="card">
    <h1>._.</h1>

    <form id="myForm">
        <input type="text" id="name" placeholder="이름을 입력하세요"><br>
        <button type="submit">결과확인</button>
    </form>

    <div id="result"></div>
</div>

<script>

/* 고양이랑 마우스  */
const cat = document.getElementById("cat");

let mouseX = 0, mouseY = 0;   // 마우스 위치

let lastPawTime = 0;          // 발자국 시간 제한용
let lastX = 0, lastY = 0;     // 발자국 거리 계산용

/* 마우스 이동 감지 */
document.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;

    const now = Date.now();

    // 마우스 이동 거리 계산
    const dx = mouseX - lastX;
    const dy = mouseY - lastY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // 일정 거리 이상 + 시간 간격일 때 발자국 생성
    if (now - lastPawTime > 80 && dist > 6) {
        createPaw(mouseX, mouseY);
        lastPawTime = now;

        lastX = mouseX;
        lastY = mouseY;
    }
});

/* 발자국 만들기 */
function createPaw(x, y) {
    const paw = document.createElement("div");
    paw.className = "paw";
    paw.textContent = "🐾";

    // 랜덤 위치
    paw.style.left = (x + (Math.random() * 10 - 5)) + "px";
    paw.style.top = (y + (Math.random() * 10 - 5)) + "px";

    document.body.appendChild(paw);

    // 발자국 삭제
    setTimeout(() => {
        paw.remove();
    }, 1300);
}

/* 고양이 마우스 따라가게 하기 */
function animate() {
    const catX = mouseX - 5;
    const catY = mouseY - 5;

    cat.style.transform = `translate(${catX}px, ${catY}px)`;

    requestAnimationFrame(animate);
}

animate();

/* 결과확인 */
document.getElementById("myForm").addEventListener("submit", (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value;

    document.getElementById("result").textContent =
        name.trim()
            ? name + "님 보고싶을거예요 💕"
            : "이름을 입력해줘요 🥺";
});

</script>

</body>
</html>
