<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>._.</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffe4ec, #e0f7ff);
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .card {
        background: rgba(255, 255, 255, 0.92);
        padding: 35px;
        border-radius: 25px;
        box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        text-align: center;
        width: 320px;
        backdrop-filter: blur(10px);
        position: relative;
        z-index: 2;
    }

    input {
        width: 90%;
        padding: 12px;
        border: 2px solid #ffd1dc;
        border-radius: 12px;
        outline: none;
    }

    button {
        margin-top: 10px;
        padding: 12px 18px;
        border: none;
        border-radius: 14px;
        background: #ff7aa2;
        color: white;
        cursor: pointer;
        font-weight: bold;
    }

    #result {
        margin-top: 18px;
        font-size: 16px;
        color: #444;
    }

    .cat {
        position: fixed;
        width: 110px;
        height: 110px;
        pointer-events: none;
        z-index: 999;
        filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
    }

    .paw {
        position: fixed;
        font-size: 18px;
        opacity: 0.85;
        pointer-events: none;
        z-index: 998;
        animation: fadeOut 1.3s forwards;
    }

    @keyframes fadeOut {
        0% { opacity: 0.85; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.6); }
    }
</style>
</head>

<body>

<div class="cat" id="cat">
<svg width="110" height="110" viewBox="0 0 64 64">

    <path d="M18 26 Q20 10 30 22 Z" fill="#000"/>
    <path d="M46 26 Q44 10 34 22 Z" fill="#000"/>

    <ellipse cx="32" cy="36" rx="20" ry="18" fill="#000"/>

    <circle cx="22" cy="44" r="6" fill="#000"/>
    <circle cx="42" cy="44" r="6" fill="#000"/>

    <ellipse cx="25" cy="33" rx="5" ry="6.5" fill="#ffd84d"/>
    <ellipse cx="39" cy="33" rx="5" ry="6.5" fill="#ffd84d"/>

    <circle cx="25" cy="34" r="1.8" fill="#000"/>
    <circle cx="39" cy="34" r="1.8" fill="#000"/>

    <circle cx="32" cy="38" r="1.4" fill="#ff9dbb"/>

    <path d="M28 40 Q32 44 36 40" stroke="#fff" stroke-width="1.2" fill="none"/>

    <path d="M18 36 L8 34" stroke="#fff" stroke-width="1"/>
    <path d="M18 39 L8 40" stroke="#fff" stroke-width="1"/>
    <path d="M46 36 L56 34" stroke="#fff" stroke-width="1"/>
    <path d="M46 39 L56 40" stroke="#fff" stroke-width="1"/>

</svg>
</div>

<div class="card">
    <h1>._.</h1>

    <form id="myForm">
        <input type="text" id="name" placeholder="이름을 입력하세요"><br>
        <button type="submit">결과확인</button>
    </form>

    <div id="result"></div>
</div>

<script>

/* 메시지 */
const messages = [
    " 누나 보고싶을거예요 💕",
    " 누나 오늘도 좋은 하루 보내세요 !!",
    " 누나 밥 많이 드세요 🍚",
    " 누나 이거 보면 웃으세요 ^_^",
    " 누나 메롱 흐흐",
    " 누나 야얘해주세요",
    " 누나 파이팅하세요 !!"
];

/* =========================
   고양이 물리 (벽 튕김)
========================= */

const cat = document.getElementById("cat");

let x = window.innerWidth / 2;
let y = window.innerHeight / 2;

let vx = (Math.random() - 0.5) * 4;
let vy = (Math.random() - 0.5) * 4;

function animate() {

    const size = 110; // 고양이 크기

    x += vx;
    y += vy;

    // 왼쪽 / 오른쪽 벽
    if (x <= 0) {
        x = 0;
        vx *= -1;
    }
    if (x >= window.innerWidth - size) {
        x = window.innerWidth - size;
        vx *= -1;
    }

    // 위 / 아래 벽
    if (y <= 0) {
        y = 0;
        vy *= -1;
    }
    if (y >= window.innerHeight - size) {
        y = window.innerHeight - size;
        vy *= -1;
    }

    cat.style.transform = `translate(${x}px, ${y}px)`;

    requestAnimationFrame(animate);
}

animate();

/* 발자국 */
let lastPawTime = 0;

document.addEventListener("mousemove", (e) => {
    const now = Date.now();

    if (now - lastPawTime > 80) {
        createPaw(e.clientX, e.clientY);
        lastPawTime = now;
    }
});

function createPaw(x, y) {
    const paw = document.createElement("div");
    paw.className = "paw";
    paw.textContent = "🐾";

    paw.style.left = (x + (Math.random() * 10 - 5)) + "px";
    paw.style.top = (y + (Math.random() * 10 - 5)) + "px";

    document.body.appendChild(paw);

    setTimeout(() => paw.remove(), 1300);
}

/* 결과 */
document.getElementById("myForm").addEventListener("submit", (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value;

    const msg = messages[Math.floor(Math.random() * messages.length)];

    document.getElementById("result").textContent =
        name.trim()
            ? name + " " + msg
            : "이름을 입력해줘요 🥺";
});

</script>

</body>
</html>
